# CI of this data repository is maintained centrally in the MerMEId MeLODy editor repository.
name: Build and Push Indexes

on:
  push:
    branches: [main, master, melody/project-domain]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data-repo:
    uses: Music-Metadata-Tools/MerMEId-MeLODy/.github/workflows/data-repo.yml@bugfix/uuids
    permissions:
      contents: write
    # Test only: remove together with switching the ref above to main.
    with:
      editor_ref: bugfix/uuids
